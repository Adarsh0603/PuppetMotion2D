# Builds the Windows app and its installer (installer/puppetmotion.iss) and
# attaches both to a GitHub Release. Runs only by hand: Actions → Release →
# Run workflow, with a tag. An existing tag is built as it is; a new one is
# built from the branch the workflow runs on and made when the release is
# published. A release that doesn't exist yet is made as a draft, so nothing
# goes public until it's published on GitHub.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, new or existing (for example v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the tag's code if the tag exists
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "$TAG"
          else
            echo "$TAG is a new tag: building $(git rev-parse --short HEAD) from ${GITHUB_REF_NAME}"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p puppetmotion
      - name: Build the installer
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup -y --no-progress
          "$iscc" //Q "//DAppVersion=${TAG#v}" installer/puppetmotion.iss
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          files=(target/release/PuppetMotion2D.exe "target/installer/PuppetMotion2D-Setup-${TAG#v}.exe")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # A new tag is made on this commit when the draft is published.
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes --draft --target "$(git rev-parse HEAD)"
          fi
