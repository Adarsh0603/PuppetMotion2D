# Builds the Windows app and attaches it to a GitHub Release. Runs only by
# hand: Actions → Release → Run workflow, with the tag to build. A release
# that doesn't exist yet is made as a draft, so nothing goes public until it's
# published on GitHub.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the exe to (for example v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p puppetmotion
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          exe=target/release/PuppetMotion2D.exe
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$exe" --clobber
          else
            gh release create "$TAG" "$exe" --title "$TAG" --generate-notes --draft
          fi
