<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PuppetMotion 2D</title>
    <meta name="description" content="Turn a single drawing into a game-ready animation, right in your browser.">
    <link data-trunk rel="icon" href="assets/icon.png">
    <link data-trunk rel="rust" data-bin="PuppetMotion2D" data-wasm-opt="2">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading {
            position: absolute; inset: 0; display: grid; place-items: center;
            color: #ccc; font: 16px system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="puppetmotion"></canvas>
    <div id="loading">Loading PuppetMotion 2D…</div>
</body>
</html>
