<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="0.6" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1b2436"/><stop offset="1" stop-color="#07090e"/>
    </radialGradient>
    <!-- One walking figure, feet at y=0, facing right, leaning slightly forward. -->
    <g id="figure" stroke-linecap="round" stroke-linejoin="round" transform="rotate(6)">
      <!-- back arm (swinging back) and back leg (pushing off) -->
      <path d="M-2 -112 L-20 -84 L-30 -56" fill="none" stroke="currentColor" stroke-width="14"/>
      <path d="M-4 -56 L-26 -28 L-50 -6 L-44 2" fill="none" stroke="currentColor" stroke-width="15"/>
      <!-- torso -->
      <path d="M2 -116 L-2 -58" fill="none" stroke="currentColor" stroke-width="24"/>
      <!-- front leg (striding) and front arm (swinging forward) -->
      <path d="M0 -56 L22 -30 L30 2 L46 4" fill="none" stroke="currentColor" stroke-width="15"/>
      <path d="M4 -112 L20 -84 L40 -70" fill="none" stroke="currentColor" stroke-width="14"/>
      <!-- head -->
      <circle cx="6" cy="-150" r="27" fill="currentColor"/>
      <!-- joint dots -->
      <g fill="#36405a">
        <circle cx="3" cy="-118" r="4.5"/>
        <circle cx="4" cy="-108" r="4.5"/><circle cx="20" cy="-84" r="4.5"/><circle cx="40" cy="-70" r="4.5"/>
        <circle cx="-20" cy="-84" r="4.5"/>
        <circle cx="-1" cy="-56" r="4.5"/><circle cx="22" cy="-30" r="4.5"/><circle cx="30" cy="2" r="4.5"/>
        <circle cx="-26" cy="-28" r="4.5"/>
      </g>
    </g>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>
  <!-- onion skins: oldest (dark) to current (white) -->
  <g transform="translate(0 6) scale(0.92) translate(10 0)">
    <use href="#figure" transform="translate(74 214)" color="#262e40" opacity="0.95"/>
    <use href="#figure" transform="translate(116 214)" color="#4a6493"/>
    <use href="#figure" transform="translate(160 214)" color="#eef1f6"/>
  </g>
  <!-- timeline -->
  <line x1="44" y1="234" x2="212" y2="234" stroke="#3c4458" stroke-width="5" stroke-linecap="round"/>
  <line x1="86" y1="234" x2="128" y2="234" stroke="#2b8cff" stroke-width="5" stroke-linecap="round"/>
  <g fill="#566078"><circle cx="44" cy="234" r="7"/><circle cx="86" cy="234" r="7"/><circle cx="170" cy="234" r="7"/><circle cx="212" cy="234" r="7"/></g>
  <circle cx="128" cy="234" r="10.5" fill="#2b8cff"/>
</svg>
