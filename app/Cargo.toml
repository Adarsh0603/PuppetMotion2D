[package]
name = "puppetmotion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The app's .exe is named after the product.
[[bin]]
name = "PuppetMotion2D"
path = "src/main.rs"

[dependencies]
anim-core = { version = "0.1.0", path = "../core" }
anim-export = { version = "0.1.0", path = "../export" }
# OpenGL ("glow") on desktop and in the browser (it builds mipmaps, so big
# drawings look smooth when zoomed out); eframe's wgpu renderer is left out.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
serde_json = "1"
# `Instant` that also works in the browser (std's panics there).
web-time = "1"

# Browser only: starting the app on the page, downloads, local storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Storage",
    "Url",
    "Window",
] }

[build-dependencies]
winresource = "0.1.34"
