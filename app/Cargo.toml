[package]
name = "puppetmotion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The app's .exe is named after the product.
[[bin]]
name = "PuppetMotion2D"
path = "src/main.rs"

[dependencies]
anim-core = { version = "0.1.0", path = "../core" }
anim-export = { version = "0.1.0", path = "../export" }
eframe = { version = "0.37.0", features = ["glow"] }
image = "0.25.10"
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.34"
